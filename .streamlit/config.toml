[theme]
primaryColor = "#0a6fd6"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#f1f3f6"
textColor = "#111827"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Serves static/ at app/static/ so the map fetches country borders once and the browser caches them.
enableStaticServing = true
