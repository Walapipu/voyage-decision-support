# Copy to secrets.toml and paste your existing OpenRouter key between the quotes.
# secrets.toml is local only and excluded from Git.
OPENROUTER_API_KEY = ""
OPENROUTER_MODEL = "openrouter/free"


# Data source. Leave out to use the data-pack CSV files in data/raw.
# To read a database instead, set source = "sql" and the connection URL below.
# The URL holds credentials: keep it here or in VOYAGE_DATABASE_URL, never in tracked files.
# [data]
# source = "sql"            # "csv" (default) or "sql"
# refresh_seconds = 600     # how often to re-read the database
# schema = "voyage"         # database schema holding the tables, if not the default
#
# [connections.voyage_db]
# url = "postgresql+psycopg://user:password@host:5432/voyage"
